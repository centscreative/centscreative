<style>

}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}.view,.rv{transform:none!important}}

header{padding-right:88px}

.in-sub{opacity:0;animation:infade .8s 2.6s ease forwards}.in-skip{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;opacity:0;animation:infade .8s 1s ease forwards}
@keyframes instar{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes indraw{to{stroke-dashoffset:0}}@keyframes infill{to{fill-opacity:1;stroke-opacity:0}}
@keyframes inline{to{width:min(16vw,140px)}}
@keyframes inspin{0%{transform:none}50%{transform:rotate(45deg) scale(1.18)}100%{transform:rotate(90deg)}}
@keyframes inletter{to{opacity:1;transform:none;filter:blur(0)}}@keyframes infade{to{opacity:1}}
.rf{width:100%;height:82dvh;border:1px solid var(--line);background:#111;margin-top:32px}
@media(max-width:860px){header{padding-right:16px}#menu{margin-right:56px}.rf{display:none}}
@media(prefers-reduced-motion:reduce){
@keyframes infadeb{from{opacity:0}to{opacity:1}}
#intro .in-spin{animation:none!important}

#intro .in-sub,#intro .in-skip{animation-name:infade!important;animation-duration:.8s!important;animation-delay:2.4s!important;animation-fill-mode:forwards!important}
#intro{transition:opacity .6s ease!important}#intro.done{transform:none!important;opacity:0;pointer-events:none}}

body.sub #bg{opacity:.22}main{z-index:1}
</style></head><body>
<header><a class="logo" href="#/home" id="logo"></a><nav id="nav"></nav><button class="sp" id="mclose" aria-label="Close menu"></button><button class="sp" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M3 7h18v2H3zM3 15h18v2H3z"/></svg></button></header>

<script>
const SP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12 17.4 12 12 17.4 12 24 12 17.4 6.6 12 0 12 6.6 12 12 6.6 12 0Z"/></svg>';
const R=['home','work','about','services','process','resume','contact'];
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let D,C,items=[],cur='home',filter='All',li=0,list=[];
fetch('portfolio.json').then(r=>r.json()).then(d=>{D=d;C=d.content;if(window.RESUME_B64){try{const bin=atob(window.RESUME_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);C.resumeUrl=URL.createObjectURL(new Blob([u],{type:'application/pdf'}))}catch(e){}}
items=d.items.filter(i=>!i.hidden).sort((a,b)=>a.order-b.order);build();intro().then(()=>route())}).catch(()=>{$('#main').textContent='Could not load portfolio.json'});
function build(){
 $('#logo').innerHTML=SP+' '+C.initials;$('#exit').innerHTML=SP;$('#mclose').innerHTML=SP;$('#lbx').innerHTML=SP;
 R.slice(1).forEach(r=>{const a=h('a',0,r);a.href='#/'+r;a.dataset.r=r;a.onclick=()=>$('#nav').classList.remove('open');$('#nav').append(a)});
 const m=$('#main');R.forEach(r=>{const s=h('section','view');s.id='v-'+r;s.hidden=true;m.append(s)});
 home();work();about();services();process();resume();contact();
 R.forEach((r,i)=>{if(r==='home')return;const p=R[i-1],n=R[i+1],d=h('div','pg rv');
  const a=h('a','lbl',(p==='home'?'Home':p));a.href='#/'+p;d.append(a);
  if(n){const b=h('a','lbl','Next: '+n);b.href='#/'+n;d.append(b)}$('#v-'+r).append(d)});
}
function rv(s,...els){els.forEach(e=>{e.classList.add('rv');s.append(e)})}
function lnk(t,href,cls){const a=h('a','btn '+(cls||''),t);a.href=href;if(/^http/.test(href)){a.target='_blank';a.rel='noopener'}return a}
function home(){const s=$('#v-home');
 const name=h('h1','name',C.name);name.append(h('span','a','I AM'),h('span','b',C.role));
 const b=h('div','btns');b.append(lnk('View my work','#/work','f'));if(C.resumeUrl){const d=lnk('View resume',C.resumeUrl);d.target='_blank';d.rel='noopener';b.append(d)}b.append(lnk('Contact','#/contact'));
 rv(s,h('p','lbl',C.availability),name,h('p','tag',C.tagline+' '+C.intro),b)}
function pic(t,src,fb){const im=new Image();im.alt='';im.loading='lazy';im.src=src;im.onerror=()=>{im.remove();fb()};t.append(im)}
function U(u){return (u||'').replace(/ /g,'%20')}
function auto(it,t){const u=it.videoUrl||'';let m;const ttl=()=>{t.textContent=it.title};
 if(m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/))return pic(t,'https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg',ttl);
 if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return pic(t,'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w640',ttl);
 if(u&&!embed(u)){const v=h('video');v.muted=true;v.playsInline=true;v.preload='metadata';v.src=U(u)+'#t=0.5';v.onerror=()=>{v.remove();ttl()};t.append(v);return}
 ttl()}
function work(){const s=$('#v-work');const f=h('div','filters'),g=h('div','grid');
 const ns=['All',...new Set(items.map(i=>i.niche))];
 ns.forEach(n=>{const b=h('button','fl'+(n===filter?' on':''),n);b.onclick=()=>{filter=n;[...f.children].forEach(x=>x.classList.toggle('on',x===b));draw()};f.append(b)});
 function draw(){g.replaceChildren();list=items.filter(i=>filter==='All'||i.niche===filter);
  if(!list.length)g.append(h('p','empty','No work in this category yet.'));
  list.forEach((it,k)=>{const c=h('button','card');c.setAttribute('aria-label','Open '+it.title);
   const t=h('div','th');if(it.thumbnailUrl)pic(t,U(it.thumbnailUrl),()=>auto(it,t));else auto(it,t);if(matchMedia('(hover:hover)').matches){c.onmouseenter=()=>{const v=t.querySelector('video');if(v)v.play().catch(()=>{})};c.onmouseleave=()=>{const v=t.querySelector('video');if(v){v.pause();v.currentTime=.5}}}
   c.append(t,h('h3',0,it.title),h('div','lbl',it.niche+' / '+it.platform+(it.type==='concept'?' / Concept':'')));c.onclick=()=>openLb(k);g.append(c)})}
 draw();rv(s,h('h2','ttl','Selected work'),f,g)}
function about(){const s=$('#v-about');const w=h('div','two');const l=h('div');l.append(h('p',0,C.bio),h('p','lbl','Tools'));
 const t=h('div','tags');C.tools.forEach(x=>t.append(h('span','tag2',x)));l.append(t);
 const r=h('div');r.append(h('p','lbl','Skills'));C.skills.forEach(x=>r.append(h('div','item',x)));w.append(l,r);rv(s,h('h2','ttl','About'),w)}
function services(){const s=$('#v-services');const c=h('div','cards');C.services.forEach(x=>{const d=h('div','item');d.append(h('h3',0,x.title),h('p',0,x.text),h('p','lbl','Custom quote'));c.append(d)});
 rv(s,h('h2','ttl','What I offer'),c,h('p','tag',C.notIncluded),lnk('Get started','#/contact','f'))}
function process(){const s=$('#v-process');const c=h('div');C.process.forEach((x,i)=>{const d=h('div','item');d.append(h('span','pn','0'+(i+1)),h('h3',0,x.title),h('p',0,x.text));c.append(d)});rv(s,h('h2','ttl','Process'),c)}
function resume(){const s=$('#v-resume');const b=h('div','btns');
 const v=lnk('View resume',C.resumeUrl,'f');v.target='_blank';v.rel='noopener';b.style.justifyContent='flex-start';b.style.margin='24px 0 0';b.append(v);
 rv(s,h('h2','ttl','Resume'),h('p','lbl','One-page resume / AI UGC and content creation'),b)}
function contact(){const s=$('#v-contact');const w=h('div','two'),l=h('div');
 l.append(h('p',0,"Tell me about your brand and I'll reply within 24 hours."),h('p','lbl','E-mail'),h('p',0,C.email),h('p','lbl','Location'),h('p',0,C.location));
 const so=h('div','soc');
 const cp=h('button','btn','Copy email');cp.onclick=()=>{const ok=()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy email',1500)};const fb=()=>{const x=h('textarea');x.value=C.email;document.body.append(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove();ok()};try{navigator.clipboard.writeText(C.email).then(ok,fb)}catch(e){fb()}};so.append(cp,lnk('Email','mailto:'+C.email));
 if(C.whatsapp)so.append(lnk('WhatsApp','https://wa.me/'+C.whatsapp.replace(/\D/g,'')));
 [['LinkedIn',C.linkedin],['Instagram',C.instagram],['Book a call',C.calendarUrl]].forEach(([n,u])=>{if(u)so.append(lnk(n,u))});l.append(so);
 const f=h('form');f.innerHTML='<h3 style="font-size:20px">Contact form</h3><input name="n" placeholder="Name" required><input name="e" type="email" placeholder="Email" required><input name="b" placeholder="Brand / company"><select name="p"><option>Single video</option><option>Hook pack</option><option>Monthly content</option><option>Partnership</option><option>Other</option></select><textarea name="m" placeholder="Message" required></textarea><input name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="btn" type="submit">Send message</button><p class="lbl" id="fm" role="status"></p>';
 f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);if(d.get('_gotcha'))return;const fm=$('#fm');
  if(C.formEndpoint){const btn=f.querySelector('button');btn.disabled=true;fm.textContent='Sending...';
   try{const r=await fetch(C.formEndpoint,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({name:d.get('n'),email:d.get('e'),brand:d.get('b'),project:d.get('p'),message:d.get('m'),_subject:'Project inquiry from '+d.get('n'),_replyto:d.get('e')})});
    if(r.ok){f.reset();fm.textContent='Message sent. I will reply within 24 hours.'}else throw 0}
   catch(_){fm.textContent='Could not send. Please email '+C.email+' directly.'}
   btn.disabled=false;return}
  const body=`Name: ${d.get('n')}\nEmail: ${d.get('e')}\nBrand: ${d.get('b')}\nProject: ${d.get('p')}\n\n${d.get('m')}`;
  location.href='mailto:'+C.email+'?subject='+encodeURIComponent('Project inquiry from '+d.get('n'))+'&body='+encodeURIComponent(body);fm.textContent='Opening your email app. If nothing opens, email '+C.email+' directly.'};
 w.append(l,f);rv(s,h('h2','ttl','Contact'),w)}
let tok=0;
function intro(){return new Promise(res=>{const el=$('#intro');

(function(){const c=document.getElementById('bg');if(!c)return;const x=c.getContext('2d');

const S1=Math.random()*6.28,S2=Math.random()*6.28,S3=Math.random()*6.28;

 return Math.sin((u+w2)*2.1+t*.21+Math.sin((v+w)*1.7-t*.17+S3)*1.2)*.8+Math.sin((v+w)*2.4-t*.19+Math.sin((u+w2)*1.3+t*.13))*.7+.4*Math.sin((u+v)*1.6+t*.11)}
